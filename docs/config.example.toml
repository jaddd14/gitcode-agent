language = "ru"
model = "claude-opus-5-5"
max_turns = 0 # 0 means no limit; set a positive value to cap model requests per user turn
compaction_threshold = 0.9
auto_compact = true # set to false to keep the full conversation until you run /compact
context_window = 200000
mouse_scroll_speed = 3 # conversation rows per mouse-wheel notch (1..=50)
intro = true

[provider]
name = "anthropic"
base_url = "https://api.anthropic.com"
protocol = "anthropic"
api_key_env = "ANTHROPIC_API_KEY"
prompt_cache = true
timeout_seconds = 120 # per attempt; a slow generation is retried rather than failing the turn
max_tokens = 32000 # raise for models that write long answers; too low truncates them
