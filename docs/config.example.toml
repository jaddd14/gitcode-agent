language = "ru"
model = "claude-opus-5-5"
max_turns = 0 # 0 means no limit; set a positive value to cap model requests per user turn
compaction_threshold = 0.9
context_window = 200000
intro = true

[provider]
name = "anthropic"
base_url = "https://api.anthropic.com"
protocol = "anthropic"
api_key_env = "ANTHROPIC_API_KEY"
prompt_cache = true
timeout_seconds = 120
