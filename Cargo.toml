[package]
name = "gitcode"
version = "0.2.2"
edition = "2021"
rust-version = "1.99"
description = "A local-first terminal coding agent with multiple wire protocols"
license = "MIT"
repository = "https://github.com/jaddd14/gitcode-agent"
homepage = "https://github.com/jaddd14/gitcode-agent"
readme = "README.md"
keywords = ["cli", "coding-agent", "terminal", "mcp", "ai"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "process", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
ignore = "0.4"
regex = "1"
globset = "0.4"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
unicode-width = "0.2"
unicode-segmentation = "1"
signal-hook = { version = "0.3", features = ["iterator"] }
libc = "0.2"
getrandom = "0.4"

[profile.dev]
opt-level = 1
debug = 0

[profile.dev.package."*"]
opt-level = 3
debug = 0

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
