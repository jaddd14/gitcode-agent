[package]
name = "gitcode"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
description = "A local-first terminal coding agent with multiple wire protocols"
license = "MIT"
repository = "https://github.com/jaddd14/gitcode-agent"
homepage = "https://github.com/jaddd14/gitcode-agent"
readme = "README.md"
keywords = ["cli", "coding-agent", "terminal", "mcp", "ai"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["assets/", "testdata/"]

[dependencies]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
